[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cozmo-floorplan"
version = "0.1.0"
description = "Local phone-capture to dimensioned FloorPlan CLI"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.21",
  "lzfse>=0.4.2",
  "numpy>=1.26",
  "pillow>=10.0",
  "pyyaml>=6.0",
]

[project.scripts]
cozmo-floorplan = "cozmo_floorplan.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

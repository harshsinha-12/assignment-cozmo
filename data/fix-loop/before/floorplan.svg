ansform="rotate(0 619 414)">350 cm [349–351; 95%]</text><text class="dimension" x="810" y="258" transform="rotate(-90 810 258)">280 cm [279–281; 95%]</text><text class="dimension" x="619" y="102" transform="rotate(360 619 102)">350 cm [349–351; 95%]</text><text class="dimension" x="428" y="258" transform="rotate(90 428 258)">280 cm [279–281; 95%]</text></g><text class="sidebar-heading" x="874" y="108">Plan summary</text><text class="meta" x="874" y="132">Status: <tspan class="status-warning">PARTIAL</tspan></text><text class="meta" x="874" y="156">Rooms: <tspan class="">2</tspan></text><text class="meta" x="874" y="180">Walls: <tspan class="">8</tspan></text><text class="meta" x="874" y="204">Openings: <tspan class="">1</tspan></text><text class="meta" x="874" y="228">Damage regions: <tspan class="">2</tspan></text><text class="meta" x="874" y="252">Scope lines: <tspan class="">2</tspan></text><text class="meta" x="874" y="276">Capture tier: <tspan class="">lidar</tspan></text><text class="meta" x="874" y="300">Scale source: <tspan class="">lidar</tspan></text><text class="meta status-warning" x="874" y="348">1 warning — see floorplan.json</text><line class="scale" x1="44" y1="430" x2="144" y2="430" /><line class="scale" x1="44" y1="425" x2="44" y2="435" /><line class="scale" x1="144" y1="425" x2="144" y2="435" /><text class="meta" x="44" y="421">100 cm</text></svg>

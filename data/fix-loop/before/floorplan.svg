<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1094 452" role="img" aria-labelledby="plan-title plan-description"><title id="plan-title">Floor plan · roomplan_two_room</title><desc id="plan-description">Dimensioned whole-property plan in centimetres with rooms, walls, openings, and confidence intervals.</desc><style>
        .background { fill: #f7f5f0; }
